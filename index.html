<!doctype html>
<html lang="en" class="preloader-active">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Automatically reload the page if a chunk or dynamic module fails to load (common after deployments)
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.indexOf('dynamically imported module') !== -1 || e.message.indexOf('Failed to fetch') !== -1)) {
          window.location.reload();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = (e.reason && e.reason.message) || e.reason || '';
        if (typeof reason === 'string' && (reason.indexOf('dynamically imported module') !== -1 || reason.indexOf('Failed to fetch') !== -1)) {
          window.location.reload();
        }
      });
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Product & UX designer building AI-powered products, scalable design systems, and interfaces people actually enjoy using. Case studies, process, and work." />

    <!-- Static social/OG fallback. This is what crawlers that don't run
         JS (LinkedIn, X, Slack, WhatsApp) see for EVERY route until
         SSR/prerendering exists — per-route values are applied
         client-side by src/hooks/useSeo.js and only reach JS-executing
         clients. Keep this set generic and site-wide. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tony — Product & UX Designer" />
    <meta property="og:title" content="I'm Tony — Product & UX Designer" />
    <meta property="og:description" content="Product & UX designer building AI-powered products, scalable design systems, and interfaces people actually enjoy using." />
    <meta property="og:url" content="https://heytony.design/" />
    <meta property="og:image" content="https://heytony.design/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="I'm Tony — Product & UX Designer" />
    <meta name="twitter:description" content="Product & UX designer building AI-powered products, scalable design systems, and interfaces people actually enjoy using." />
    <meta name="twitter:image" content="https://heytony.design/og-image.png" />
    <!-- No static canonical on purpose: this shell serves every route,
         so a static href would mark /about and every case study as a
         duplicate of "/". useSeo.js sets the correct one per route. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preloads the Latin subset's actual woff2 file (the one that
         covers the Hero headline's characters) so it's already in
         flight before the stylesheet below is even parsed, instead of
         only being discovered once that stylesheet's @font-face is
         read. This is what actually shrinks the fallback-font window
         that caused the headline's weight/style to flash before
         settling. Versioned/hashed Google Fonts URL — if Google
         revisions this font file later, this preload just becomes an
         inert no-op rather than an error, so it's safe to leave as-is
         until re-verified. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/bricolagegrotesque/v9/3y9K6as8bTXq_nANBjzKo3IeZx8z6up5BeSl9D4dj_x9PpZBMlGIInE.woff2"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
      rel="stylesheet"
    />
    <title>I'm Tony — Product & UX Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
